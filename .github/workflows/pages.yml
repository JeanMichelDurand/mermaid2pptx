# Publishes the browser version (web/index.html + the package's wheel + examples/) to GitHub Pages
# on every release tag, so the web page always runs the latest released converter.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: assemble the site
        run: |
          mkdir -p site/examples
          python -m pip wheel --no-deps --wheel-dir site .
          (cd site && ls *.whl > wheel.txt)          # the page installs the wheel this file names
          cp web/index.html site/
          cp examples/*.mmd site/examples/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
