name: tests

on:
  push:
    branches: [main]            # a pull request's branch is tested by the pull_request event
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3      # settings in pyproject.toml [tool.ruff]

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: package installs and runs
        shell: bash
        run: |
          python -m pip install .
          mermaid2pptx --version
          mermaid2pptx examples/flowchart.mmd -o flowchart.pptx

  # The one check branch protection requires: green only when every job above is.
  ci-ok:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
